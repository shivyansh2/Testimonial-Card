<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content ="width=device-width,initial-scale=1.0">
        <title>Testimonial Card</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <figure class="testimonial-card">
                <figcaption class="testimonial-card_author">
                    <img src="profile-thumbnail.png" alt="Profile Thumbnail">
                    <div class="testimonial-card_author_info">
                        <div class="testimonial-card_author_name">Sarah Dole</div>
                        <div class="testimonial-card_author_username">@sarahdole</div>
                    </div>
                </figcaption>
                <blockquote>
                    <p>I've been searching for high-quality abstract images for my design projects,and I'm thrilled to have found this platform.The variety and depth of creativity are astounding!</p>
                </blockquote>
            </figure>
        </div>
    </body>
</html>
